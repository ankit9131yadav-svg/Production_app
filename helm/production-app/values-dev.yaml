namespace: production-dev

replicaCount: 1

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

image:
  repository: ankit9131/production-app
  tag: latest

service:
  type: NodePort
  port: 80
  targetPort: 80

containerPort: 80

config:
  APP_ENV: dev
  APP_NAME: Production DevOps Platform
  APP_PORT: "80"

autoscaling:
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

pdb:
  minAvailable: 1

secret:
  DB_USERNAME: dev_user
  DB_PASSWORD: dev_only_password
  API_KEY: dev_only_api_key

ingress:
  host: dev.production-app.local
